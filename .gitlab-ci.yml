# =============================================================================
# GitLab CI/CD Pipeline for DeOldify
# =============================================================================
# Requires:
#   - GitLab Docker runner (or standard runner with Docker-in-Docker)
#   - CI/CD variables: CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY
# =============================================================================

stages:
  - lint
  - build
  - test
  - push

variables:
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}
  DOCKER_TAG: ${CI_COMMIT_SHORT_SHA}
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache pip downloads across pipelines
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip/
    - .venv/

# ---------------------------------------------------------------------------
# Stage: Lint
# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir black pylint
  script:
    - echo "Running Black formatter check..."
    - black -S --check deoldify/ || echo "Black formatting issues found (non-blocking)"
    - echo "Running Pylint..."
    - pip install -r requirements.txt --no-deps || true
    - pylint --disable=W deoldify/ || true
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: Build Docker Image
# ---------------------------------------------------------------------------
build:gpu:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - echo "Building GPU Docker image..."
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${DOCKER_IMAGE}:latest
      -t ${DOCKER_IMAGE}:${DOCKER_TAG}
      -t ${DOCKER_IMAGE}:latest
      .
    - docker push ${DOCKER_IMAGE}:${DOCKER_TAG}
    - docker push ${DOCKER_IMAGE}:latest
  only:
    - main
    - master
    - tags

build:cpu:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - echo "Building CPU-only Docker image..."
    - >
      docker build
      --build-arg INSTALL_CUDA=false
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${DOCKER_IMAGE}-cpu:latest
      -t ${DOCKER_IMAGE}-cpu:${DOCKER_TAG}
      -t ${DOCKER_IMAGE}-cpu:latest
      .
    - docker push ${DOCKER_IMAGE}-cpu:${DOCKER_TAG}
    - docker push ${DOCKER_IMAGE}-cpu:latest
  only:
    - main
    - master
    - tags

# ---------------------------------------------------------------------------
# Stage: Test (smoke test)
# ---------------------------------------------------------------------------
smoke:test:
  stage: test
  image: ${DOCKER_IMAGE}:${DOCKER_TAG}
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  allow_failure: true
  script:
    - echo "Running smoke tests..."
    - python -c "import torch; print(f'PyTorch {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}')"
    - python -c "import torchvision; print(f'torchvision {torchvision.__version__}')"
    - python -c "import deoldify; print('deoldify imported successfully')"
    - python -c "from deoldify.device import DeviceId; print(f'Device IDs: {[d.name for d in DeviceId]}')"
    - echo "Smoke tests passed"
  needs:
    - build:gpu

# ---------------------------------------------------------------------------
# Stage: Push (tagged releases only)
# ---------------------------------------------------------------------------
push:release:
  stage: push
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - echo "Tagging release image..."
    - docker pull ${DOCKER_IMAGE}:${DOCKER_TAG}
    - docker tag ${DOCKER_IMAGE}:${DOCKER_TAG} ${DOCKER_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${DOCKER_IMAGE}:${CI_COMMIT_TAG}
  only:
    - tags
  when: on_success
